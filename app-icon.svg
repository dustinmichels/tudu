<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Indigo 500 to Indigo 800 -->
    <linearGradient id="tuduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="45%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>

    <!-- Top Rim Specular Highlight for crispness -->
    <linearGradient id="tuduRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Checkmark Gradient: Mint to Emerald -->
    <linearGradient id="tuduCheck" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="url(#tuduBg)" />

  <!-- Rim Highlight -->
  <rect x="41" y="41" width="430" height="430" rx="95" fill="none" stroke="url(#tuduRim)" stroke-width="2" />

  <!-- CheckSquare Glyph (Centered at 256, 256) -->
  <g transform="translate(68.5, 76) scale(15.0)">
    <!-- Box frame in clean white -->
    <path
      d="M21 10.656V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12.344"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Checkmark in vibrant emerald green -->
    <path
      d="m9 11 3 3L22 4"
      fill="none"
      stroke="url(#tuduCheck)"
      stroke-width="2.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
